<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E4374">
<meta name="description" content="管院五科學習與題庫，專為研究所推甄面試準備。">
<title>推甄戰備室</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<script>
/* 字級要在首次繪製前就套上，否則每次開啟都會先閃一下 16px 再跳到設定值——
   字調得越大這一下越明顯。js/app.js 是 module（延後執行）來不及，
   所以這裡用一小段同步腳本先讀 localStorage。壞掉也只是退回預設字級。 */
try {
  var s = JSON.parse(localStorage.getItem('gradprep.v1') || '{}');
  var px = Math.round(Number(s && s.settings && s.settings.textSize));
  if (px >= 12 && px <= 30) document.documentElement.style.fontSize = px + 'px';
} catch (e) { /* 忽略：字級不是核心功能，不該擋住 App 啟動 */ }
</script>
</head>
<body>

<!-- ══ SVG 圖示庫（全站共用，不使用 emoji） ══ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-today" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>
      <circle cx="12" cy="15.5" r="1.8" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-book" viewBox="0 0 24 24">
      <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/><path d="M8 7.5h7M8 11h5"/>
    </symbol>
    <symbol id="i-target" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/>
      <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-me" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.6-4.2 3.7-6.3 7.5-6.3s6.9 2.1 7.5 6.3"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24">
      <path d="m12 3.6 2.6 5.3 5.9.9-4.25 4.15 1 5.85L12 17.05 6.75 19.8l1-5.85L3.5 9.8l5.9-.9z"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24">
      <rect x="7" y="3.5" width="13" height="14" rx="2"/><path d="M16.5 20.5H6a2.5 2.5 0 0 1-2.5-2.5V7"/>
    </symbol>
    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M9.5 7h10M9.5 12h10M9.5 17h10"/><path d="m4 6.6 1.3 1.3L7.6 5.4M4 16.6l1.3 1.3 2.3-2.5"/><circle cx="5.6" cy="12" r="1.2" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24">
      <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M13.5 6.5 17.5 10.5"/>
    </symbol>
    <symbol id="i-mic" viewBox="0 0 24 24">
      <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V21.5M8.5 21.5h7"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.3l3.3 2"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24">
      <path d="M12 2.5s5.5 4.4 5.5 9.4a5.5 5.5 0 0 1-11 0c0-2 1-3.5 1-3.5s.6 1.8 2 1.8c1.8 0 1.2-4.6 2.5-7.7"/>
    </symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24">
      <path d="M9 17.5a6 6 0 1 1 6 0v1.5H9z"/><path d="M9.8 21.5h4.4"/>
    </symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3.5v12M7 11l5 5 5-5M4.5 20.5h15"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16.5v-12M7 9l5-5 5 5M4.5 20.5h15"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4.5 6.5h15M9.5 6.5V4h5v2.5M6.5 6.5 7.5 21h9l1-14.5M10.5 10v7M13.5 10v7"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24">
      <path d="M3.5 6.5h3.2l9.8 11h4M3.5 17.5h3.2l3.3-3.8M13.2 9.3l3.3-3.8h4"/><path d="m18 3 2.5 2.5L18 8M18 15l2.5 2.5L18 20"/>
    </symbol>
    <symbol id="i-warn" viewBox="0 0 24 24">
      <path d="M12 3.5 21.5 20h-19z"/><path d="M12 9.5v4.5"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-textsize" viewBox="0 0 24 24">
      <path d="M2.5 17.5 6 9l3.5 8.5M3.7 14.7h4.6"/>
      <path d="M12.5 17.5 17.5 5l5 12.5M14.2 12.9h6.6"/>
    </symbol>
  </defs>
</svg>

<!-- ══ 頂列 ══ -->
<header class="topbar">
  <h1 class="topbar__title">推甄戰備室</h1>
  <button class="iconbtn" id="textsize-btn" type="button" title="調整字體大小" aria-label="調整字體大小">
    <svg class="ic"><use href="#i-textsize"/></svg>
  </button>
  <button class="countdown" id="countdown-chip" type="button" title="設定目標日期">
    <svg class="ic"><use href="#i-clock"/></svg>
    <span id="countdown-text">—</span>
  </button>
</header>

<!-- ══ 主內容 ══ -->
<main id="main">
  <section class="view" id="view-today" data-view="today"></section>
  <section class="view" id="view-read"  data-view="read" hidden></section>
  <section class="view" id="view-drill" data-view="drill" hidden></section>
  <section class="view" id="view-me"    data-view="me" hidden></section>
</main>

<!-- ══ 底部分頁 ══ -->
<nav class="tabbar" id="tabbar">
  <button class="tab is-active" data-go="today"><svg class="ic"><use href="#i-today"/></svg><span>今天</span></button>
  <button class="tab" data-go="read"><svg class="ic"><use href="#i-book"/></svg><span>讀</span></button>
  <button class="tab" data-go="drill"><svg class="ic"><use href="#i-target"/></svg><span>練</span></button>
  <button class="tab" data-go="me"><svg class="ic"><use href="#i-me"/></svg><span>我</span></button>
</nav>

<!-- ══ 全螢幕作答層（閃卡／選擇題／申論／口試共用） ══ -->
<div class="sheet" id="sheet" hidden>
  <header class="sheet__bar">
    <button class="iconbtn" id="sheet-close" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button>
    <div class="sheet__meta">
      <div class="sheet__title" id="sheet-title"></div>
      <div class="progressbar"><div class="progressbar__fill" id="sheet-progress"></div></div>
    </div>
    <div class="sheet__count" id="sheet-count"></div>
  </header>
  <div class="sheet__body" id="sheet-body"></div>
  <div class="sheet__foot" id="sheet-foot"></div>
</div>

<!-- ══ 一般彈窗（設定、素材編輯…） ══ -->
<div class="modal" id="modal" hidden>
  <div class="modal__panel" role="dialog" aria-modal="true">
    <header class="modal__bar">
      <div class="modal__title" id="modal-title"></div>
      <button class="iconbtn" id="modal-close" aria-label="關閉"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>
    <div class="modal__body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
